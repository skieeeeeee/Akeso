server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Single-page app: unknown paths are client routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the API so the browser stays same-origin (no CORS, no absolute
    # URLs in the client). API_URL is substituted at deploy time.
    location /api/ {
        proxy_pass         ${API_URL};
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    location = /health {
        proxy_pass ${API_URL}/health;
    }

    # Hashed assets are immutable; index.html must never be cached.
    location ~* \.(js|css|woff2?|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
