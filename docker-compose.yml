# Local, production-shaped stack: Postgres + API + web.
#   docker compose up --build
#   docker compose exec api python -m app.cli seed
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medikiosk
      POSTGRES_PASSWORD: medikiosk
      POSTGRES_DB: medikiosk
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medikiosk"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://medikiosk:medikiosk@db:5432/medikiosk
      TEST_DATABASE_URL: postgresql+psycopg://medikiosk:medikiosk@db:5432/medikiosk_test
      # Override in a real deployment.
      JWT_SECRET: compose-only-secret-change-me
      EXPOSE_MOCK_OTP: "true"
      AI_PROVIDER: none
      OCR_PROVIDER: auto
      CORS_ORIGINS: '["http://localhost:8080"]'
    volumes:
      # Uploaded documents survive a container rebuild.
      - api-uploads:/app/var
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
    # nginx.conf uses ${API_URL}; envsubst renders it at start-up.
    command: >
      /bin/sh -c "envsubst '$$API_URL' < /etc/nginx/conf.d/default.conf
      > /etc/nginx/conf.d/default.rendered.conf
      && mv /etc/nginx/conf.d/default.rendered.conf /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    ports:
      - "8080:80"

volumes:
  db-data:
  api-uploads:
