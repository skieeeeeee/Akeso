# MediKiosk API on Render.
#
# The frontend is not here: it is a static Vite build and belongs on Vercel.
# This file describes the API and its database only.
#
# Render's dashboard reads this on "New > Blueprint". Everything below is
# free-tier except the disk, which is $0 for 1 GB on a paid instance and
# unavailable on free — see the note on UPLOAD_DIR.
services:
  - type: web
    name: medikiosk-api
    # NOT SET DELIBERATELY, and worth a decision rather than a default.
    #
    # Render defaults to Oregon. Measured from Delhi: the TCP handshake to
    # the onrender.com edge takes 6ms, but /health — which touches no
    # database — answers in 270ms. That ~265ms is transit to Oregon and back,
    # paid by every single request, and a page makes three of them.
    #
    # `region: singapore` would cut it to roughly 40-60ms from India. It is
    # not set here because Render cannot move an existing service between
    # regions: applying it recreates the service AND the database, so the
    # demo data has to be reseeded and VITE_API_BASE_URL on Vercel has to be
    # pointed at the new hostname. Worth doing before real users; not worth
    # doing silently to a running deployment.
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # --- Database ------------------------------------------------------
      # Render injects `postgres://…`. The app rewrites that to the psycopg
      # driver form on load, so this works as-is.
      - key: DATABASE_URL
        fromDatabase:
          name: medikiosk-db
          property: connectionString

      # --- Application ---------------------------------------------------
      - key: ENVIRONMENT
        value: development
      - key: DEBUG
        value: "false"

      # Generated once by Render and kept across deploys.
      - key: JWT_SECRET
        generateValue: true

      # --- Sign-in --------------------------------------------------------
      # One code for every number, because there is no SMS gateway. The code
      # is not returned to the client or shown anywhere, so signing in
      # requires knowing it — which is why the demo patients, not the mobile
      # form, are the way in for anyone who does not.
      #
      # Clear DEV_FIXED_OTP before any real patient signs in.
      - key: DEV_FIXED_OTP
        value: "12345"
      - key: EXPOSE_MOCK_OTP
        value: "false"

      # --- Demo data ------------------------------------------------------
      # Idempotent: upserts by mobile number on every boot.
      - key: SEED_DEMO_PATIENTS
        value: "true"

      # --- Browser origin -------------------------------------------------
      # The frontend's origin, which the browser sends on every API call. A
      # JSON array, no trailing slashes. Vercel preview deployments each get
      # their own domain, so add any you need to reach the API from.
      #
      # Kept here rather than in the dashboard because this service is
      # blueprint-managed: a dashboard edit can be reverted by the next sync.
      - key: CORS_ORIGINS
        value: '["https://akeso-zeta.vercel.app", "http://localhost:5173"]'

      # --- Visit handoff --------------------------------------------------
      # Where the web app is served. Set, the handoff QR carries a link and
      # the clinician's phone opens the full visit as a page; unset, the code
      # carries the visit data itself, which needs no network but holds less.
      - key: PUBLIC_WEB_URL
        value: https://akeso-zeta.vercel.app

      # --- Speech ---------------------------------------------------------
      # Set the value in the dashboard, not here: it is a secret. The key
      # needs the "Text to Speech" permission or every request 401s.
      # Unset simply means the browser reads questions aloud instead.
      - key: ELEVENLABS_API_KEY
        sync: false

      # --- Document scanning ----------------------------------------------
      # The OCR models are installed in the image. On the free instance
      # (512 MB RAM) loading them can be tight; set OCR_PROVIDER=off if the
      # service restarts under memory pressure. Uploads are still stored.
      - key: OCR_PROVIDER
        value: auto

      # Free instances have no persistent disk, so uploads live in the
      # container filesystem and are lost on restart. On a paid instance,
      # attach a disk and point this at its mount path.
      - key: UPLOAD_DIR
        value: /app/var/uploads

databases:
  - name: medikiosk-db
    plan: free
    databaseName: medikiosk
    user: medikiosk
